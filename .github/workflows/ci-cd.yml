name: User Service CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # CHECKOUT

      - name: Checkout Repository
        uses: actions/checkout@v4

      # START TIMER

      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # CREATE LOG FILE

      - name: Create Log File
        run: touch pipeline.log

      # SETUP NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # INSTALL

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..." | tee -a pipeline.log
          npm install 2>&1 | tee -a pipeline.log

      # TESTS

      - name: Run Tests
        run: |
          echo "Running tests..." | tee -a pipeline.log
          npm test 2>&1 | tee -a pipeline.log

      # BUILD IMAGE

      - name: Build Docker Image
        run: |
          echo "Building Docker image..." | tee -a pipeline.log
          docker build -t user-service . 2>&1 | tee -a pipeline.log

      # PUSH COMPLETE LOGS TO GRAFANA CLOUD LOKI

      - name: Send Logs to Grafana Cloud
        if: always()
        run: |
          # Limit log size (IMPORTANT)
          LOG_CONTENT=$(tail -n 200 build.log | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')

          TIMESTAMP=$(date +%s%N)

          curl -v -u "${{ secrets.GRAFANA_USER }}:${{ secrets.GRAFANA_API_KEY }}" \
            -X POST "${{ secrets.GRAFANA_URL }}" \
            -H "Content-Type: application/json" \
            --data-raw "{
              \"streams\": [
                {
                  \"stream\": {
                    \"job\": \"github-actions-api_GateWay\",
                    \"repo\": \"${{ github.repository }}\",
                    \"branch\": \"${{ github.ref_name }}\",
                    \"status\": \"${{ job.status }}\"
                  },
                  \"values\": [
                    [\"$TIMESTAMP\", \"$LOG_CONTENT\"]
                  ]
                }
              ]
            }"
